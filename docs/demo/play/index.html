<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="description" content="Four specimens ride the same tube, one after another. Watch Tracer warn the lab when one goes quiet." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Tracer · Watch it play</title>
  <script type="module" crossorigin src="./assets/index-DXNj04sz.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CLqPuFXQ.css">
</head>
<body>
  <div id="app" class="autoplay">
    <main id="world" role="img" aria-label="A pneumatic tube bench in a lab. A white capsule is the specimen; a glow shows where Tracer thinks it is."><div id="loading">Pressurizing the tube…</div></main>
    <div id="veil"></div>
    <div class="vignette"></div>
    <div class="pl-alarm" aria-hidden="true"></div>

    <header class="pl-top">
      <div class="pl-brand"><span class="pl-dot"></span>Tracer<span class="pl-tag"></span></div>
      <p class="pl-source">Synthetic data, no clinical review.</p>
    </header>

    <div class="pl-caption" aria-live="polite"></div>

    <footer class="pl-hud">
      <div class="pl-clock">
        <svg class="pl-ring" viewBox="0 0 64 64" aria-hidden="true">
          <circle class="pl-ring-bg" cx="32" cy="32" r="28" />
          <circle class="pl-ring-fg" cx="32" cy="32" r="28" pathLength="100" />
        </svg>
        <span class="pl-clock-v">0</span>
        <span class="pl-clock-k">minutes since it left the ward</span>
      </div>
      <div class="pl-meter">
        <span class="pl-meter-k">Risk</span>
        <div class="pl-meter-track">
          <div class="pl-meter-fill"></div>
          <div class="pl-meter-mark"><span>Alert</span></div>
        </div>
      </div>
    </footer>

    <div class="pl-card" hidden>
      <div class="pl-card-k"></div>
      <div class="pl-card-n"></div>
      <div class="pl-card-u"></div>
      <div class="pl-card-s"></div>
    </div>
  </div>
</body>
</html>
