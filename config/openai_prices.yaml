# OpenAI prices for the v2 scenario jobs (docs/neural/spec.md §4.5, Appendix A).
#
# USD per million tokens, short context (272K input tokens or fewer; every scenario request is far below it).
# Copied from OpenAI's official pricing page and checked against each model's page. A spending command refuses
# to run when verified_at is more than 24 hours old or when the model and tier it would use are missing here,
# so re-check the pages and rewrite this file (with a new verified_at) before every spending stage.
#
# cache_write is the 30-minute retention write rate; cache_write_12h is the 12-hour one. The jobs use 30-minute
# retention, so cache_write is the rate a worst-case reservation charges for uncached input. Batch and Flex are
# exactly half of Standard in every column on the page.

verified_at: "2026-11-13T02:27:20-05:00"
checked_by: "Claude Code (Opus 5.5), re-checked on the pricing page, the Flex guide and the gpt-6.1-terra page before O4; unchanged"
source_url: "https://developers.openai.com/api/docs/pricing"
model_pages:
  gpt-6.1-terra: "https://developers.openai.com/api/docs/models/gpt-6.1-terra"
  gpt-6.1-sol: "https://developers.openai.com/api/docs/models/gpt-6.1-sol"
  gpt-6-luna: "https://developers.openai.com/api/docs/models/gpt-6-luna"
long_context_rule: "Over 272K input tokens: 2x input and cache rates and 1.5x output for the whole request (not used here)"

models:
  gpt-6.1-terra:
    standard: {input: 1.00, cached_input: 0.05, cache_write: 1.25, cache_write_12h: 2.50, output: 5.00}
    batch:    {input: 0.50, cached_input: 0.025, cache_write: 0.625, cache_write_12h: 1.25, output: 2.50}
    flex:     {input: 0.50, cached_input: 0.025, cache_write: 0.625, cache_write_12h: 1.25, output: 2.50}
    reasoning_efforts: [none, low, medium, high, xhigh, max]
  gpt-6.1-sol:
    standard: {input: 2.00, cached_input: 0.10, cache_write: 2.50, cache_write_12h: 5.00, output: 10.00}
    batch:    {input: 1.00, cached_input: 0.05, cache_write: 1.25, cache_write_12h: 2.50, output: 5.00}
    flex:     {input: 1.00, cached_input: 0.05, cache_write: 1.25, cache_write_12h: 2.50, output: 5.00}
    reasoning_efforts: [low, medium, high, xhigh, max]
  gpt-6-luna:
    standard: {input: 0.10, cached_input: 0.01, cache_write: 0.125, cache_write_12h: 0.25, output: 0.50}
    batch:    {input: 0.05, cached_input: 0.005, cache_write: 0.0625, cache_write_12h: 0.125, output: 0.25}
    flex:     {input: 0.05, cached_input: 0.005, cache_write: 0.0625, cache_write_12h: 0.125, output: 0.25}
    reasoning_efforts: [none, low, medium, high, xhigh, max]
